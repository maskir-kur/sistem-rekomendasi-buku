name: Build and Deploy to VPS 1GB

on:
  push:
    branches:
      - main # Jalankan otomatisasi setiap push ke branch main
    paths:
      - 'backend/**'
      - 'ml_recommender/**'
      - 'docker-compose.yml' # Ikut dipantau jika Anda mengubah port/env kontainer di VPS

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_ML: ghcr.io/${{ github.repository }}/ml_recommender

jobs:
  # --- JOB 1: Build Image di Server GitHub ---
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push Backend Node.js
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:latest

      # Build & Push ML Python FastAPI
      - name: Build and Push ML Recommender
        uses: docker/build-push-action@v5
        with:
          context: ./ml_recommender
          push: true
          tags: ${{ env.IMAGE_ML }}:latest

# --- JOB 2: Deploy Instan ke VPS ---
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # Step 1: Ambil file dari repository GitHub ke Runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Kirim file docker-compose.yml terbaru ke VPS via SCP
      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/"

      # Step 3: Jalankan perintah Remote SSH seperti biasa
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          timeout: 30m
          script: |
            cd /home/ubuntu
            
            # 1. Login Docker di VPS ke GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. Matikan container lama
            docker compose down
            
            # 3. Bersihkan cache
            docker system prune -f
            
            # 4. Pull image terbaru
            docker compose pull database
            docker compose pull backend
            docker compose pull ml_recommender
            
            # 5. Nyalakan layanan (cukup jalankan ini sekali, Docker akan memproses dependency & healthcheck)
            docker compose up -d
